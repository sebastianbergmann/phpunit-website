                        <tr class="{{rowClass}}">
                            <th scope="row">{{name}}</th>
                            <td><span class="badge {{badgeClass}}">{{status}}</span></td>
                            <td>{{supportedMinorVersion}}</td>
                            <td>{{phpCompatibility}}</td>
                            <td><time datetime="{{releasedIso}}">{{released}}</time></td>
                            <td><time datetime="{{endOfBugfixSupportIso}}">{{endOfBugfixSupport}}</time></td>
                            <td>{{endOfLife}}</td>
                        </tr>
