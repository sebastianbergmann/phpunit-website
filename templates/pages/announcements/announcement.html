<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{{title}}</title>
        <meta name="description" content="{{description}}">
        <link rel="canonical" href="https://phpunit.de/announcements/{{page}}">

        <meta property="og:site_name" content="PHPUnit">
        <meta property="og:locale" content="en_US">
        <meta property="og:type" content="article">
        <meta property="og:title" content="{{title}}">
        <meta property="og:description" content="{{description}}">
        <meta property="og:url" content="https://phpunit.de/announcements/{{page}}">
        <meta property="og:image" content="https://phpunit.de/img/phpunit-og.jpg">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="The PHPUnit logo">
        <meta property="article:published_time" content="{{isoDate}}">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="{{title}}">
        <meta name="twitter:description" content="{{description}}">
        <meta name="twitter:image" content="https://phpunit.de/img/phpunit-og.jpg">
        <meta name="fediverse:creator" content="@phpunit@phpc.social">

        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
        <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f151b">

        <link rel="preload" href="/fonts/OpenSans.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="stylesheet" href="/css/phpunit.css?v=2">

        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "Organization",
                    "@id": "https://phpunit.de/#organization",
                    "name": "PHPUnit",
                    "url": "https://phpunit.de/",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://phpunit.de/img/phpunit.svg"
                    },
                    "sameAs": [
                        "https://github.com/sebastianbergmann/phpunit",
                        "https://phpc.social/@phpunit"
                    ]
                },
                {
                    "@type": "WebSite",
                    "@id": "https://phpunit.de/#website",
                    "url": "https://phpunit.de/",
                    "name": "PHPUnit",
                    "publisher": {
                        "@id": "https://phpunit.de/#organization"
                    },
                    "inLanguage": "en"
                },
                {
                    "@type": "BreadcrumbList",
                    "itemListElement": [
                        {
                            "@type": "ListItem",
                            "position": 1,
                            "name": "Home",
                            "item": "https://phpunit.de/"
                        },
                        {
                            "@type": "ListItem",
                            "position": 2,
                            "name": "Announcements",
                            "item": "https://phpunit.de/announcements/"
                        },
                        {
                            "@type": "ListItem",
                            "position": 3,
                            "name": "{{title}}"
                        }
                    ]
                },
                {
                    "@type": "Article",
                    "headline": "{{title}}",
                    "description": "{{description}}",
                    "datePublished": "{{isoDate}}",
                    "author": {
                        "@type": "Person",
                        "name": "Sebastian Bergmann",
                        "url": "https://sebastian-bergmann.de/"
                    },
                    "publisher": {
                        "@id": "https://phpunit.de/#organization"
                    },
                    "mainEntityOfPage": "https://phpunit.de/announcements/{{page}}",
                    "image": "https://phpunit.de/img/phpunit-og.jpg",
                    "inLanguage": "en"
                }
            ]
        }
        </script>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to content</a>

{{header}}

        <main id="main" class="wrap">
{{content}}
        </main>

{{footer}}
    </body>
</html>
